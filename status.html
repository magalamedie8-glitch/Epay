<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071c22"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Epay"><link rel="stylesheet" href="style.css"><title>Payment Status</title></head><body>
<div class="app"><header class="bar"><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="#ffb81c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg> Epay</div><span class="pill" id="net" hidden>Offline</span></header>
<main class="sheet"><div class="badge" id="badge">…</div><h1 id="title">Checking payment</h1><p id="msg"></p>
<div class="ref" id="ref" hidden></div><div class="spacer"></div><a class="btn" id="cta" href="index.html">Back to Epay</a></main></div>
<script src="app.js"></script>
<script>
const q=new URLSearchParams(location.search),s=q.get("status"),ref=q.get("tx_ref");
const ok=s==="successful"||s==="completed",cancel=s==="cancelled";
badge.className="badge "+(ok?"ok":"bad");badge.textContent=ok?"✓":"✕";
title.textContent=ok?"Payment received":cancel?"Payment cancelled":"Payment not completed";
msg.textContent=ok?"Thank you. Keep your reference below and show it if you need support.":cancel?"You closed the payment. No money was taken.":"The approval timed out or was declined. No money was taken. Try again.";
if(ref){const r=document.getElementById("ref");r.hidden=false;r.textContent="Ref: "+ref}
if(ok)cta.textContent="Done";
</script></body></html>
